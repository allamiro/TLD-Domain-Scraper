{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h2 class="mb-3">Scrape Domains</h2>
        <p class="text-muted">Enter one or more TLDs separated by commas. The scraper will query Google and store
            all discovered base domains in the database.</p>

        <form action="{{ url_for('main.scrape') }}" method="post" id="scrape-form">
            <div class="mb-3">
                <label for="tlds" class="form-label fw-semibold">TLDs (comma-separated)</label>
                <input type="text" class="form-control" id="tlds" name="tlds"
                       placeholder=".ir, .co.ir, .ac.ir" required>
                <div class="form-text">Example: <code>.ir, .co.ir, .org.ir</code></div>
            </div>
            <button type="submit" class="btn btn-primary" id="scrape-btn">
                Start Scraping
            </button>
        </form>

        <div id="scrape-progress" class="mt-3 d-none">
            <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
            Scraping in progress — this may take several minutes...
        </div>
    </div>
</div>
{% endblock %}
