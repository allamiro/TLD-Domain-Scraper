{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h2 class="mb-1">Scrape Domains</h2>
    <p class="text-muted mb-4">Enter one or more TLDs separated by commas and choose how to handle existing data.</p>

    <form action="{{ url_for('main.scrape') }}" method="post" id="scrape-form">

      <div class="mb-3">
        <label for="tlds" class="form-label fw-semibold">TLDs (comma-separated)</label>
        <input type="text" class="form-control" id="tlds" name="tlds"
               placeholder=".ir, .co.ir, .ac.ir" required>
        <div class="form-text">Example: <code>.ir, .co.ir, .org.ir</code></div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Mode</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="mode" id="mode-append"
                   value="append" checked>
            <label class="form-check-label" for="mode-append">
              <strong>Append</strong>
              <div class="text-muted small">Keep all previously found domains. Only add new ones discovered in this run.</div>
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="mode" id="mode-replace"
                   value="replace">
            <label class="form-check-label" for="mode-replace">
              <strong>Replace</strong>
              <div class="text-muted small">Delete all existing domains for the selected TLD(s) and replace with this run's results.</div>
            </label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="scrape-btn">
        Start Scraping
      </button>
    </form>

    <div id="scrape-progress" class="mt-3 d-none text-muted">
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Starting scrape job...
    </div>
  </div>
</div>
{% endblock %}
